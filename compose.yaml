services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile

    stdin_open: true
    tty: true

    working_dir: /workspace

    env_file:
      - ${HOME}/.config/opencode/9router.env
      - ${HOME}/.config/opencode/go.env

    environment:
      HOME: /home/agent
      TERM: xterm-256color
      COLORTERM: truecolor

      DISPLAY: ${DISPLAY:-:0}

      SSH_AUTH_SOCK: /ssh-agent

      GIT_TERMINAL_PROMPT: "0"

      # Keep Ansible temporary files inside the container user's home.
      ANSIBLE_LOCAL_TEMP: /home/agent/.ansible/tmp
      ANSIBLE_REMOTE_TEMP: /tmp/.ansible-agent

    volumes:
      # The agent can access only this repository.
      - ${WORKSPACE_DIR:-.}:/workspace

      # Shared OpenCode configuration.
      - ${HOME}/.config/opencode:/home/agent/.config/opencode

      # Persistent OpenCode sessions/data.
      - opencode-share:/home/agent/.local/share/opencode
      - opencode-state:/home/agent/.local/state/opencode

      # Persistent Codex
      - ${HOME}/.config/codex:/home/agent/.codex

      # Forward loaded SSH keys without exposing their private files.
      - ${SSH_AUTH_SOCK}:/ssh-agent

      # SSH host aliases and host verification.
      - ${HOME}/.ssh/config:/home/agent/.ssh/config:ro
      - ${HOME}/.ssh/known_hosts:/home/agent/.ssh/known_hosts:ro

      # X11 clipboard.
      - /tmp/.X11-unix:/tmp/.X11-unix:ro

      # Ansible Vault pass.
      - ${HOME}/.vault_pass:/home/agent/.vault_pass

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=64m,mode=0755

    restart: "no"

volumes:
  opencode-share:
  opencode-state:
