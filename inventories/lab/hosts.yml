---
all:
  children:
    lab:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_opencode
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o ProxyJump=proxmox
      hosts:
        agent:
          ansible_host: 192.168.10.19
        ai-gateway:
          ansible_host: 192.168.10.18
        cloud:
          ansible_host: 192.168.10.15
        dns:
          ansible_host: 192.168.10.2
        docserver:
          ansible_host: 192.168.10.16
        gateway:
          ansible_host: 192.168.10.5
        media:
          ansible_host: 192.168.10.17
        network:
          ansible_host: 192.168.10.11
        proxy:
          ansible_host: 192.168.10.3
        site:
          ansible_host: 192.168.10.13
        tools:
          ansible_host: 192.168.10.14
        vpn:
          ansible_host: 192.168.10.4
    infra:
      vars:
        ansible_user: root
      hosts:
        proxmox:
          ansible_host: 192.168.10.10
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_proxmox_opencode
        nas:
          ansible_host: 192.168.10.12
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_opencode
