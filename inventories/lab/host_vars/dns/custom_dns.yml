---
# Web services behind NPM proxy: FQDNs resolve to the proxy (192.168.10.3),
# NPM routes by Host header.
pihole_custom_dns:
  - ip: 192.168.10.3
    domains:
      - chef.omni.corp
      - containers.omni.corp
      - dns.omni.corp
      - nas.omni.corp
      - proxy.omni.corp
      - site.omni.corp
      - monitor.omni.corp
      - cloud.omni.corp
      - docs.omni.corp
      - media.omni.corp
      - switch.omni.corp
      - database.omni.corp
      - ai-gateway.omni.corp
      - agent.omni.corp
      - network.omni.corp
      - vault.omni.corp
  # Short-name records so `ssh root@<hostname>` resolves directly to each CT.
  - ip: 192.168.10.2
    domains: [dns]
  - ip: 192.168.10.3
    domains: [proxy]
  - ip: 192.168.10.4
    domains: [vpn]
  - ip: 192.168.10.5
    domains: [mail]
  - ip: 192.168.10.10
    domains: [proxmox]
  - ip: 192.168.10.11
    domains: [network]
  - ip: 192.168.10.12
    domains: [nas]
  - ip: 192.168.10.13
    domains: [site]
  - ip: 192.168.10.14
    domains: [tools]
  - ip: 192.168.10.15
    domains: [cloud]
  - ip: 192.168.10.16
    domains: [docserver]
  - ip: 192.168.10.17
    domains: [media]
  - ip: 192.168.10.18
    domains: [ai-gateway]
  - ip: 192.168.10.19
    domains: [agent]
  - ip: 192.168.10.20
    domains: [vault]
