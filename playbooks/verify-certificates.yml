---
- name: Verify internal CA certificates served by NPM
  hosts: proxy
  become: true
  gather_facts: true

  vars:
    nginx_proxy_manager_api_url: "http://localhost:81/api"
    nginx_proxy_manager_data_path: /opt/npm/data
    nginx_proxy_manager_container_name: npm

  tasks:
    - name: Verify NPM certificate deployment
      ansible.builtin.include_role:
        name: internal_ca
        tasks_from: verify_npm.yml
