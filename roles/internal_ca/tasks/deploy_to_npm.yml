---
- name: Check if NPM data directory exists
  ansible.builtin.stat:
    path: "{{ nginx_proxy_manager_data_path }}"
  register: internal_ca_npm_data_dir

- name: Ensure NPM custom SSL base directory exists
  ansible.builtin.file:
    path: "{{ nginx_proxy_manager_data_path }}/custom_ssl"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  when: internal_ca_npm_data_dir.stat.exists

- name: Create NPM certificate directory for each domain
  ansible.builtin.file:
    path: "{{ nginx_proxy_manager_data_path }}/custom_ssl/npm-{{ loop_index + 1 }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"
  loop: "{{ internal_ca_domains }}"
  loop_control:
    index_var: loop_index
  when: internal_ca_npm_data_dir.stat.exists

- name: Copy domain fullchain certificate to NPM
  ansible.builtin.copy:
    src: "{{ internal_ca_base_dir }}/certs/{{ item.name }}.fullchain.crt"
    dest: "{{ nginx_proxy_manager_data_path }}/custom_ssl/npm-{{ loop_index + 1 }}/fullchain.pem"
    remote_src: true
    owner: "1000"
    group: "1000"
    mode: "0600"
  loop: "{{ internal_ca_domains }}"
  loop_control:
    index_var: loop_index
  when: internal_ca_npm_data_dir.stat.exists

- name: Copy domain private key to NPM
  ansible.builtin.copy:
    src: "{{ internal_ca_base_dir }}/private/{{ item.name }}.key"
    dest: "{{ nginx_proxy_manager_data_path }}/custom_ssl/npm-{{ loop_index + 1 }}/privkey.pem"
    remote_src: true
    owner: "1000"
    group: "1000"
    mode: "0600"
  loop: "{{ internal_ca_domains }}"
  loop_control:
    index_var: loop_index
  when: internal_ca_npm_data_dir.stat.exists

- name: Restart NPM after cert deploy
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_proxy_manager_install_dir }}"
    state: restarted
  when:
    - internal_ca_npm_data_dir.stat.exists
    - nginx_proxy_manager_install_dir is defined
