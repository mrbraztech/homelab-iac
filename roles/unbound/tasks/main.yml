---
- name: Install Unbound
  ansible.builtin.apt:
    name: "{{ unbound_package }}"
    state: present
    update_cache: true

- name: Deploy Unbound configuration
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: /etc/unbound/unbound.conf.d/pihole.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Unbound

- name: Ensure root hints exist
  ansible.builtin.get_url:
    url: https://www.internic.net/domain/named.root
    dest: /var/lib/unbound/root.hints
    owner: root
    group: unbound
    mode: "0644"

- name: Ensure Unbound is enabled and running
  ansible.builtin.systemd:
    name: unbound
    state: started
    enabled: true

- name: Wait for Unbound to be ready
  ansible.builtin.wait_for:
    port: "{{ unbound_listen_port }}"
    delay: 2
    timeout: 10
