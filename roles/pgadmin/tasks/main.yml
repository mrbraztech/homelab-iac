---
- name: Ensure pgAdmin directory exists
  ansible.builtin.file:
    path: "{{ pgadmin_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pgadmin_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart pgAdmin

- name: Ensure pgAdmin container is running
  community.docker.docker_compose_v2:
    project_src: "{{ pgadmin_install_dir }}"
    state: present
