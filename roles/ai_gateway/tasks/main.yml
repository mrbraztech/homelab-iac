---
- name: Ensure installation directory exists
  ansible.builtin.file:
    path: "{{ ai_gateway_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure 9router data directory exists
  ansible.builtin.file:
    path: "{{ ai_gateway_data_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Check if 9router container already exists
  community.docker.docker_container_info:
    name: "{{ ai_gateway_container_name }}"
  register: ai_gateway_existing_container

- name: Set 9router container running fact
  ansible.builtin.set_fact:
    ai_gateway_container_running: >-
      {{ ai_gateway_existing_container.exists
         and ai_gateway_existing_container.container.State.Status == 'running' }}

- name: Check if headroom container already exists
  community.docker.docker_container_info:
    name: "{{ ai_gateway_headroom_container_name }}"
  register: ai_gateway_headroom_existing

- name: Set headroom container running fact
  ansible.builtin.set_fact:
    ai_gateway_headroom_running: >-
      {{ ai_gateway_headroom_existing.exists
         and ai_gateway_headroom_existing.container.State.Status == 'running' }}

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ai_gateway_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Ensure 9router stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ ai_gateway_install_dir }}"
    state: present
  when: not ai_gateway_container_running or not ai_gateway_headroom_running

- name: Wait for 9router API to be ready
  ansible.builtin.wait_for:
    port: "{{ ai_gateway_port }}"
    delay: 5
    timeout: 30
