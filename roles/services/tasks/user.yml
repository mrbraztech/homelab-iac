---
- name: Create ansible user
  ansible.builtin.user:
    name: "{{ bootstrap_admin_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Configure passwordless sudo for ansible user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ bootstrap_admin_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
    content: |
      {{ bootstrap_admin_user }} ALL=(ALL) NOPASSWD: ALL

- name: Install ansible user SSH keys
  ansible.posix.authorized_key:
    user: "{{ bootstrap_admin_user }}"
    key: "{{ item }}"
    state: present
    manage_dir: true
  loop: "{{ bootstrap_admin_authorized_keys }}"
