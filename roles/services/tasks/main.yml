---
- name: Import user setup tasks
  ansible.builtin.import_tasks: user.yml
  tags:
    - services
    - user

- name: Ensure installation directory exists
  ansible.builtin.file:
    path: "{{ services_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure PostgreSQL data directory exists
  ansible.builtin.file:
    path: "{{ services_postgres_volume_path }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"

- name: Stop and remove existing containers (migration cleanup)
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop:
    - "{{ services_postgres_container_name }}"
    - "{{ services_redis_container_name }}"
  when: services_remove_existing_containers | default(false) | bool

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart services

- name: Ensure containers are running
  community.docker.docker_compose_v2:
    project_src: "{{ services_install_dir }}"
    state: present

- name: Wait for PostgreSQL to be ready
  ansible.builtin.wait_for:
    port: "{{ services_postgres_port }}"
    delay: 5
    timeout: 30

- name: Ensure databases exist
  community.postgresql.postgresql_db:
    name: "{{ item }}"
    login_host: "127.0.0.1"
    login_port: "{{ services_postgres_port }}"
    login_user: postgres
    login_password: "{{ services_postgres_password }}"
  loop: "{{ services_postgres_databases }}"
