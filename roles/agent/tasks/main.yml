---
- name: Ensure hermes install directory exists
  ansible.builtin.file:
    path: "{{ agent_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure hermes data directory exists
  ansible.builtin.file:
    path: "{{ agent_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ agent_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes

- name: Ensure hermes AI gateway API key in env file
  ansible.builtin.lineinfile:
    path: "{{ agent_data_dir }}/.env"
    regexp: "^HERMES_CUSTOM_AI_GATEWAY_OMNI_CORP_API_KEY=.*$"
    line: "HERMES_CUSTOM_AI_GATEWAY_OMNI_CORP_API_KEY={{ agent_ai_gateway_api_key }}"
    owner: "10000"
    group: "10000"
    mode: "0600"
    create: true
  notify: Restart hermes

- name: Ensure hermes Telegram bot token in env file
  ansible.builtin.lineinfile:
    path: "{{ agent_data_dir }}/.env"
    regexp: "^TELEGRAM_BOT_TOKEN=.*$"
    line: "TELEGRAM_BOT_TOKEN={{ agent_telegram_bot_token }}"
    owner: "10000"
    group: "10000"
    mode: "0600"
    create: true
  notify: Restart hermes

- name: Ensure hermes Telegram allowed users in env file
  ansible.builtin.lineinfile:
    path: "{{ agent_data_dir }}/.env"
    regexp: "^TELEGRAM_ALLOWED_USERS=.*$"
    line: "TELEGRAM_ALLOWED_USERS={{ agent_telegram_allowed_users }}"
    owner: "10000"
    group: "10000"
    mode: "0600"
    create: true
  notify: Restart hermes

- name: Ensure hermes Telegram fallback IPs in env file
  ansible.builtin.lineinfile:
    path: "{{ agent_data_dir }}/.env"
    regexp: "^TELEGRAM_FALLBACK_IPS=.*$"
    line: "TELEGRAM_FALLBACK_IPS={{ agent_telegram_fallback_ips }}"
    owner: "10000"
    group: "10000"
    mode: "0600"
    create: true
  notify: Restart hermes

- name: Ensure hermes container is running
  community.docker.docker_compose_v2:
    project_src: "{{ agent_install_dir }}"
    state: present
