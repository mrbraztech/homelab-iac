---
- name: Install Postfix and SASL modules
  ansible.builtin.apt:
    name:
      - postfix
      - libsasl2-modules
    state: present
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Deploy Postfix main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Postfix

- name: Deploy SMTP2GO SASL credentials
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"

- name: Rebuild SASL password map
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  changed_when: false

- name: Deploy sender generic map
  ansible.builtin.template:
    src: generic.j2
    dest: /etc/postfix/generic
    owner: root
    group: root
    mode: "0644"

- name: Deploy mail aliases
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"

- name: Rebuild aliases database
  ansible.builtin.command: newaliases
  changed_when: false

- name: Enable and start Postfix
  ansible.builtin.systemd:
    name: postfix
    state: started
    enabled: true
    daemon_reload: true
