---
docker_edition: ce

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_remove_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-doc
  - podman-docker
  - containerd
  - runc

docker_repo_url: https://download.docker.com/linux/debian
docker_gpg_key_url: https://download.docker.com/linux/debian/gpg
docker_gpg_key_path: /etc/apt/keyrings/docker.asc
docker_repo_path: /etc/apt/sources.list.d/docker.sources

docker_daemon_json: {}

# Users to add to the docker group.
docker_users: []
