---
- name: Remove conflicting Docker packages
  ansible.builtin.import_tasks: remove_conflicting.yml
  tags:
    - docker
    - packages

- name: Configure Docker repository
  ansible.builtin.import_tasks: repository.yml
  tags:
    - docker
    - repository

- name: Install Docker packages
  ansible.builtin.import_tasks: packages.yml
  tags:
    - docker
    - packages

- name: Configure Docker daemon
  ansible.builtin.import_tasks: daemon.yml
  tags:
    - docker
    - configuration

- name: Manage Docker users
  ansible.builtin.import_tasks: users.yml
  tags:
    - docker
    - users

# Run pending handlers (e.g. Restart Docker) before service roles start, so a
# daemon restart cannot interrupt an image pull/container creation mid-flight.
- name: Flush pending Docker handlers
  ansible.builtin.meta: flush_handlers
