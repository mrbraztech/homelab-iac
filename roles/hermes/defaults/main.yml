---
# Hermes Agent installation settings
hermes_version: "latest"
hermes_install_path: "/opt/hermes"
hermes_user: "hermes"
hermes_group: "hermes"

# System dependencies
hermes_system_packages:
  - curl
  - git
  - build-essential
  - python3
  - python3-pip
  - python3-venv
  - nodejs
  - npm
  - ffmpeg
  - ripgrep
  - ca-certificates

# Hermes configuration
hermes_config_dir: "/home/{{ hermes_user }}/.hermes"
hermes_data_dir: "/home/{{ hermes_user }}/.hermes/data"

# Service settings
hermes_enable_service: true
hermes_gateway_enable: false
hermes_gateway_port: 8080

# Optional: API keys (store in vault)
# hermes_openai_api_key: ""
# hermes_anthropic_api_key: ""
# hermes_openrouter_api_key: ""
