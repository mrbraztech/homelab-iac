---
pihole_image: pihole/pihole:latest
pihole_container_name: pihole
pihole_http_port: "80"
pihole_dns_port: "53"
pihole_https_port: "443"
pihole_data_path: /opt/pihole/data
pihole_install_dir: /opt/pihole
pihole_password: "{{ vault_pihole_password }}"
pihole_dns_upstream: "127.0.0.1#5353"
pihole_custom_dns: []
pihole_blocklists:
  - url: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
    comment: "StevenBlack unified hosts"
  - url: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt"
    comment: "Hagezi Pro"
  - url: "https://v.firebog.net/hosts/Easyprivacy.txt"
    comment: "EasyPrivacy"
  - url: "https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt"
    comment: "Windows SpyBlocker"
  - url: "https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/android-tracking.txt"
    comment: "Android Tracking"
  - url: "https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV-AGH.txt"
    comment: "SmartTV AGH"
  - url: "https://raw.githubusercontent.com/nickspaargaren/dns-over-https/main/pihole-google-projects.txt"
    comment: "DNS-over-HTTPS providers"
  - url: "https://big.oisd.nl"
    comment: "oisd big"
  - url: "https://raw.githubusercontent.com/mrxehmad/pi-hole-adlist/main/doh-list"
    comment: "DNS-over-HTTPS (DoH) providers"
  - url: "https://raw.githubusercontent.com/Bryantdl7/pihole-blocklists/main/dns-https-block.txt"
    comment: "DNS HTTPS blocklist (wildcard)"
  - url: "https://urlhaus.abuse.ch/downloads/hostfile/"
    comment: "URLhaus malware domains"
  - url: "https://phishing.army/download/phishing_army_blocklist.txt"
    comment: "Phishing Army blocklist"
  - url: "https://hole.cert.pl/domains/v2/domains.txt"
    comment: "CERT.pl malicious domains"
  - url: "https://nsfw.oisd.nl"
    comment: "oisd NSFW (adult content)"
  - url: "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt"
    comment: "Hagezi Pro (jsdelivr CDN)"
