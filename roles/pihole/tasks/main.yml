---
- name: Ensure installation directory exists
  ansible.builtin.file:
    path: "{{ pihole_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Pi-hole data directory exists
  ansible.builtin.file:
    path: "{{ pihole_data_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Check if Pi-hole container already exists
  community.docker.docker_container_info:
    name: "{{ pihole_container_name }}"
  register: pihole_existing_container

- name: Set Pi-hole container running fact
  ansible.builtin.set_fact:
    pihole_container_running: >-
      {{ pihole_existing_container.exists
         and pihole_existing_container.container.State.Status == 'running' }}

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pihole_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Pi-hole

- name: Ensure Pi-hole container is running
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_install_dir }}"
    state: present
  when: not pihole_container_running

- name: Wait for Pi-hole to be ready
  ansible.builtin.wait_for:
    port: "{{ pihole_http_port }}"
    delay: 5
    timeout: 30

- name: Authenticate with Pi-hole API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pihole_http_port }}/api/auth"
    method: POST
    body_format: json
    body:
      password: "{{ pihole_password }}"
    status_code: 200
  register: pihole_auth
  no_log: true
  when: not ansible_check_mode

- name: Set upstream DNS to local Unbound resolver
  ansible.builtin.shell: |
    set -o pipefail
    docker exec pihole cp /etc/pihole/pihole.toml /etc/pihole/pihole.toml.bak
    docker exec pihole sed \
      -i "/upstreams = \[/,/^\s*\]/{/\"127\.0\.0\.1#5353\"/!{/^[[:space:]]*\"/d}}" \
      /etc/pihole/pihole.toml
    docker exec pihole sed -i '/upstreams = \[/a\        "127.0.0.1#5353",' /etc/pihole/pihole.toml
  args:
    executable: /bin/bash
  register: pihole_upstream
  changed_when: pihole_upstream.rc == 0
  notify: Restart Pi-hole
  when: not ansible_check_mode

- name: Build custom DNS hosts list
  ansible.builtin.set_fact:
    pihole_dns_hosts: "{{ pihole_dns_hosts | default([]) + [item.0.ip + ' ' + item.1] }}"
  loop: "{{ pihole_custom_dns | subelements('domains') }}"
  loop_control:
    label: "{{ item.0.ip }} {{ item.1 }}"
  when: not ansible_check_mode

- name: Set custom DNS records via Pi-hole v6 API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pihole_http_port }}/api/config/dns/hosts"
    method: PATCH
    headers:
      sid: "{{ pihole_auth.json.session.sid }}"
    body_format: json
    body:
      config:
        dns:
          hosts: "{{ pihole_dns_hosts }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - pihole_custom_dns | length > 0

- name: Ensure blocklists are configured
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pihole_http_port }}/api/lists"
    method: GET
    headers:
      sid: "{{ pihole_auth.json.session.sid }}"
    status_code: 200
  register: pihole_lists
  when: not ansible_check_mode

- name: Build list of desired blocklist URLs
  ansible.builtin.set_fact:
    pihole_desired_urls: "{{ pihole_blocklists | map(attribute='url') | list }}"
  when: not ansible_check_mode

- name: Remove blocklists not in configuration
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pihole_http_port }}/api/lists/{{ item.id }}?type=block"
    method: DELETE
    headers:
      sid: "{{ pihole_auth.json.session.sid }}"
    status_code: [200, 204]
  loop: "{{ pihole_lists.json.lists | selectattr('type', 'equalto', 'block') | list }}"
  when:
    - not ansible_check_mode
    - pihole_lists.json is defined
    - pihole_lists.json.lists is defined
    - item.address not in pihole_desired_urls
  notify: Update Pi-hole gravity

- name: Add missing blocklists
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pihole_http_port }}/api/lists?type=block"
    method: POST
    headers:
      sid: "{{ pihole_auth.json.session.sid }}"
    body_format: json
    body:
      address: "{{ item.url }}"
      comment: "{{ item.comment }}"
      enabled: true
    status_code: [200, 201, 409]
  loop: "{{ pihole_blocklists }}"
  register: pihole_list_result
  notify: Update Pi-hole gravity
  when:
    - not ansible_check_mode
    - pihole_lists.json is defined
    - pihole_lists.json.lists is defined
    - (pihole_lists.json.lists | selectattr('address', 'equalto', item.url) | list | length == 0)
