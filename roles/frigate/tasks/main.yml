---
- name: Ensure installation directory exists
  ansible.builtin.file:
    path: "{{ frigate_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Frigate directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  loop:
    - "{{ frigate_data_path }}"
    - "{{ frigate_config_path }}"

- name: Check if Frigate container already exists
  community.docker.docker_container_info:
    name: "{{ frigate_container_name }}"
  register: frigate_existing_container

- name: Set Frigate container running fact
  ansible.builtin.set_fact:
    frigate_container_running: >-
      {{ frigate_existing_container.exists
         and frigate_existing_container.container.State.Status == 'running' }}

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ frigate_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Frigate

- name: Deploy Frigate config.yml
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ frigate_config_path }}/config.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Frigate

- name: Ensure Frigate container is running
  community.docker.docker_compose_v2:
    project_src: "{{ frigate_install_dir }}"
    state: present
  when: not frigate_container_running

- name: Wait for Frigate to be ready
  ansible.builtin.wait_for:
    port: "{{ frigate_http_port }}"
    delay: 10
    timeout: 60
