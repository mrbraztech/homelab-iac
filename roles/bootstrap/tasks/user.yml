---
- name: Create administrative user
  ansible.builtin.user:
    name: "{{ bootstrap_admin_user }}"
    groups: "{{ bootstrap_admin_groups | join(',') }}"
    append: true
    shell: "{{ bootstrap_admin_shell }}"
    create_home: true
    state: present

- name: Configure passwordless sudo for administrative user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ bootstrap_admin_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
    content: |
      {{ bootstrap_admin_user }} ALL=(ALL) NOPASSWD: ALL

- name: Gather existing user information
  ansible.builtin.getent:
    database: passwd
  when: ansible_check_mode

- name: Install administrative user SSH keys
  ansible.posix.authorized_key:
    user: "{{ bootstrap_admin_user }}"
    key: "{{ item }}"
    state: present
    manage_dir: true
  loop: "{{ bootstrap_admin_authorized_keys }}"
  when: >
    not ansible_check_mode
    or bootstrap_admin_user in ansible_facts.getent_passwd

- name: Check for AllowGroups in sshd config
  ansible.builtin.shell:
    cmd: set -o pipefail && grep -r "^AllowGroups" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null | head -1
    executable: /bin/bash
  register: bootstrap_allowgroups
  changed_when: false
  check_mode: false

- name: Add user to AllowGroups (OMV compat)
  ansible.builtin.user:
    name: "{{ bootstrap_admin_user }}"
    groups: "{{ bootstrap_allowgroups.stdout | regex_search('AllowGroups\\s+(\\S+)', '\\1') | first }}"
    append: true
  when:
    - bootstrap_allowgroups.stdout | length > 0
    - bootstrap_admin_user not in bootstrap_allowgroups.stdout

- name: Remind to update inventory
  ansible.builtin.debug:
    msg:
      - "User '{{ bootstrap_admin_user }}' created successfully."
      - "Next step: update inventories/lab/hosts.yml"
      - "Change ansible_user from 'root' to '{{ bootstrap_admin_user }}' for this host."
      - "Then run: ansible-playbook playbooks/common.yml --limit {{ inventory_hostname }}"
  when: ansible_user == "root"
