---
- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe
  when: bootstrap_upgrade_packages

- name: Install bootstrap packages
  ansible.builtin.apt:
    name: "{{ bootstrap_packages }}"
    state: present
