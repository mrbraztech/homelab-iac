---
- name: Ensure installation directory exists
  ansible.builtin.file:
    path: "{{ nextcloud_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Nextcloud data directory exists
  ansible.builtin.file:
    path: "{{ nextcloud_data_path }}"
    state: directory
    mode: "0770"

- name: Ensure Nextcloud html directory exists
  ansible.builtin.file:
    path: "{{ nextcloud_install_dir }}/html"
    state: directory
    owner: "www-data"
    group: "www-data"
    mode: "0755"

- name: Check if Nextcloud container already exists
  community.docker.docker_container_info:
    name: "{{ nextcloud_container_name }}"
  register: nextcloud_existing_container

- name: Set Nextcloud container running fact
  ansible.builtin.set_fact:
    nextcloud_container_running: >-
      {{ nextcloud_existing_container.exists
         and nextcloud_existing_container.container.State.Status == 'running' }}

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nextcloud_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nextcloud

- name: Ensure Nextcloud container is running
  community.docker.docker_compose_v2:
    project_src: "{{ nextcloud_install_dir }}"
    state: present
  when: not nextcloud_container_running

- name: Wait for Nextcloud to be ready
  ansible.builtin.wait_for:
    port: "{{ nextcloud_http_port }}"
    delay: 10
    timeout: 60
