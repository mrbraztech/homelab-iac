---
- name: Ensure installation directory exists
  ansible.builtin.file:
    path: "{{ onlyoffice_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure OnlyOffice directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  loop:
    - "{{ onlyoffice_data_path }}"
    - "{{ onlyoffice_log_path }}"

- name: Check if OnlyOffice container already exists
  community.docker.docker_container_info:
    name: "{{ onlyoffice_container_name }}"
  register: onlyoffice_existing_container

- name: Set OnlyOffice container running fact
  ansible.builtin.set_fact:
    onlyoffice_container_running: >-
      {{ onlyoffice_existing_container.exists
         and onlyoffice_existing_container.container.State.Status == 'running' }}

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ onlyoffice_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart OnlyOffice

- name: Ensure OnlyOffice container is running
  community.docker.docker_compose_v2:
    project_src: "{{ onlyoffice_install_dir }}"
    state: present
  when: not onlyoffice_container_running

- name: Wait for OnlyOffice to be ready
  ansible.builtin.wait_for:
    port: "{{ onlyoffice_http_port }}"
    delay: 15
    timeout: 120
