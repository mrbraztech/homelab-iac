---
- name: Gather package facts
  ansible.builtin.package_facts:

- name: Install Tailscale archive keyring
  when: "'tailscale-archive-keyring' not in ansible_facts.packages"
  block:
    - name: Download Tailscale archive keyring package
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts.distribution_release }}.deb"
        dest: /tmp/tailscale-archive-keyring.deb
        mode: "0644"

    - name: Install Tailscale archive keyring package
      ansible.builtin.apt:
        deb: /tmp/tailscale-archive-keyring.deb

- name: Configure Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/debian
    suites: "{{ ansible_facts.distribution_release }}"
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Remove legacy one-line Tailscale apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  notify: Restart Tailscale
  when: "'tailscale' not in ansible_facts.packages"

- name: Ensure tailscaled service is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check if Tailscale node is already authenticated
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Authenticate Tailscale node
  ansible.builtin.command: >-
    tailscale up
    --hostname={{ tailscale_hostname }}
    --authkey={{ tailscale_auth_key }}
    {{ tailscale_extra_args }}
  changed_when: true
  when: tailscale_status.rc != 0

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
