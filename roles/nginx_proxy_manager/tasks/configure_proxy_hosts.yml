---
- name: Wait for NPM API to be ready
  ansible.builtin.uri:
    url: "{{ nginx_proxy_manager_api_url | regex_replace('/api$', '') }}/health"
    method: GET
    status_code: 200
  register: nginx_proxy_manager_health
  until: nginx_proxy_manager_health.status == 200
  retries: 30
  delay: 2

- name: Authenticate with NPM API
  ansible.builtin.uri:
    url: "{{ nginx_proxy_manager_api_url }}/tokens"
    method: POST
    body_format: json
    body:
      identity: "{{ nginx_proxy_manager_admin_email }}"
      secret: "{{ nginx_proxy_manager_admin_password }}"
    status_code: 200
  register: nginx_proxy_manager_auth
  no_log: true

- name: Get existing proxy hosts
  ansible.builtin.uri:
    url: "{{ nginx_proxy_manager_api_url }}/nginx/proxy-hosts"
    method: GET
    headers:
      Authorization: "Bearer {{ nginx_proxy_manager_auth.json.token }}"
    status_code: 200
  register: nginx_proxy_manager_existing_hosts

- name: Create or update proxy hosts
  ansible.builtin.uri:
    url: "{{ nginx_proxy_manager_api_url }}/nginx/proxy-hosts{% if existing_host %}/{{ existing_host.id }}{% endif %}"
    method: "{% if existing_host %}PUT{% else %}POST{% endif %}"
    headers:
      Authorization: "Bearer {{ nginx_proxy_manager_auth.json.token }}"
    body_format: json
    body:
      domain_names: "{{ proxy_host.domain_names }}"
      forward_scheme: "{{ proxy_host.forward_scheme }}"
      forward_host: "{{ proxy_host.forward_host }}"
      forward_port: "{{ proxy_host.forward_port }}"
      access_list_id: >-
        {{ proxy_host.access_list_id
           if proxy_host.access_list_id is defined
           else existing_host.access_list_id | default(0) }}
      certificate_id: >-
        {{ proxy_host.certificate_id
           if proxy_host.certificate_id is defined
           else existing_host.certificate_id | default(0) }}
      ssl_forced: >-
        {{ proxy_host.ssl_forced
           if proxy_host.ssl_forced is defined
           else existing_host.ssl_forced | default(false) }}
      caching_enabled: >-
        {{ proxy_host.caching_enabled
           if proxy_host.caching_enabled is defined
           else existing_host.caching_enabled | default(false) }}
      block_exploits: >-
        {{ proxy_host.block_exploits
           if proxy_host.block_exploits is defined
           else existing_host.block_exploits | default(false) }}
      advanced_config: >-
        {{ proxy_host.advanced_config
           if proxy_host.advanced_config is defined
           else existing_host.advanced_config | default('') }}
      meta:
        letsencrypt_agree: false
        dns_challenge: false
      allow_websocket_upgrade: >-
        {{ proxy_host.allow_websocket_upgrade
           if proxy_host.allow_websocket_upgrade is defined
           else existing_host.allow_websocket_upgrade | default(true) }}
      http2_support: >-
        {{ proxy_host.http2_support
           if proxy_host.http2_support is defined
           else existing_host.http2_support | default(false) }}
      enabled: true
    status_code: [200, 201]
  loop: >-
    {{ nginx_proxy_manager_proxy_hosts
       if nginx_proxy_manager_proxy_hosts
       else nginx_proxy_manager_default_proxy_hosts }}
  loop_control:
    loop_var: proxy_host
    label: "{{ proxy_host.domain_names | join(', ') }}"
  vars:
    existing_host: >-
      {{ nginx_proxy_manager_existing_hosts.json |
         selectattr('domain_names', 'equalto', proxy_host.domain_names) |
         first | default({}) }}
  when: nginx_proxy_manager_configure_proxy_hosts
