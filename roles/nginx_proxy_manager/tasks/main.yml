---
- name: Ensure installation directory exists
  ansible.builtin.file:
    path: "{{ nginx_proxy_manager_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure NPM data directory exists
  ansible.builtin.file:
    path: "{{ nginx_proxy_manager_data_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Ensure NPM letsencrypt directory exists
  ansible.builtin.file:
    path: "{{ nginx_proxy_manager_letsencrypt_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Check if NPM container already exists
  community.docker.docker_container_info:
    name: "{{ nginx_proxy_manager_container_name }}"
  register: nginx_proxy_manager_existing_container

- name: Set NPM container running fact
  ansible.builtin.set_fact:
    nginx_proxy_manager_container_running: >-
      {{ nginx_proxy_manager_existing_container.exists
         and nginx_proxy_manager_existing_container.container.State.Status == 'running' }}

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nginx_proxy_manager_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Ensure NPM container is running
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_proxy_manager_install_dir }}"
    state: present
  when: not nginx_proxy_manager_container_running

- name: Wait for NPM admin UI to be ready
  ansible.builtin.wait_for:
    port: "{{ nginx_proxy_manager_admin_port }}"
    delay: 10
    timeout: 60

- name: Configure proxy hosts
  ansible.builtin.include_tasks: configure_proxy_hosts.yml
  when: nginx_proxy_manager_configure_proxy_hosts
